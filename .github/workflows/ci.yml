name: Impresa Semplice CI

on:
  push:
    branches:
      - feat/impresa-semplice-clean
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Controlla sintassi
        run: npm run check
      - name: Esegui test
        run: npm test
