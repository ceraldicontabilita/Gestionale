name: Impresa Semplice CI

on:
  push:
    branches:
      - feat/impresa-semplice-clean
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Registra esclusivamente il lockfile aggiornato
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "chore: aggiorna package-lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Controlla sintassi
        run: npm run check

      - name: Avvia MongoDB replica set per i test reali
        run: |
          docker run -d --name impresa-mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            if docker exec impresa-mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1; then break; fi
            sleep 1
          done
          docker exec impresa-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 60); do
            if docker exec impresa-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then break; fi
            sleep 1
          done
          docker exec impresa-mongo mongosh --quiet --eval "if (!db.hello().isWritablePrimary) { quit(2) }"

      - name: Esegui test unitari e integrazione MongoDB
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: npm test
